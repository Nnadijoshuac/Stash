<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stash</title>
  <meta name="description" content="Stash on Solana devnet: set a rule, get paid, stash the slice.">
  <link rel="icon" type="image/png" href="/brand/stash-splat-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/app/app.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><img src="/brand/stash-splat-64.png" alt="" width="22" height="22"><span>Stash</span></a>
    <span class="nav-right">
      <span class="pill" id="network">Devnet</span>
      <button id="account" class="pill account" hidden></button>
    </span>
  </nav>

  <main id="welcome" class="welcome">
    <img class="splat" src="/brand/stash-splat-master.png" alt="">
    <h1>Invest a slice<span class="soft">of every payment</span></h1>
    <button id="connect" class="primary big">Connect wallet</button>
    <p class="fine">Solana devnet. Test money only.</p>
  </main>

  <main id="app" class="app" hidden>
    <section class="totals">
      <div><p class="label">Stashed</p><p class="big-n" id="saved">$0.00</p></div>
      <div><p class="label">Wallet</p><p class="mid-n" id="usdc">$0.00</p></div>
    </section>

    <section>
      <p class="label">Your rule</p>
      <p class="rule">Stash <span id="shares" class="chips"></span></p>
      <p class="rule">into <span id="stocks" class="chips"></span></p>
      <button id="save" class="primary" hidden>Save rule</button>
    </section>

    <section>
      <div class="head">
        <p class="label">Payments</p>
        <button id="pay" class="text">Get a $2 test payment</button>
      </div>
      <div id="payments"></div>
      <button id="withdraw" class="text" hidden></button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <footer class="foot">
    <a href="https://github.com/Nnadijoshuac/Stash">Source</a>
    <a href="/stash.apk">Android app</a>
  </footer>
  <script type="module" src="/app/app.js"></script>
</body>
</html>
