<!DOCTYPE html>
<!-- Real phone-width viewports for checking layouts: open this file in a
     browser while the app runs on localhost:4321. Each frame is exactly the
     device's CSS width, so nothing is emulated or cropped. -->
<html><head><meta charset="utf-8"><title>Stash phone frames</title>
<style>
  body { margin: 0; background: #2a2f3a; font: 13px system-ui; color: #ccd; display: flex; gap: 28px; padding: 20px; overflow-x: auto; }
  figure { margin: 0; } figcaption { margin-bottom: 6px; }
  iframe { border: 0; border-radius: 18px; background: #fff; display: block; }
</style></head><body>
  <figure><figcaption>Landing · 390 × 844</figcaption><iframe src="http://localhost:4321/" width="390" height="844"></iframe></figure>
  <figure><figcaption>App · 390 × 844</figcaption><iframe src="http://localhost:4321/app" width="390" height="844"></iframe></figure>
  <figure><figcaption>Landing · 320 × 640</figcaption><iframe src="http://localhost:4321/" width="320" height="640"></iframe></figure>
  <figure><figcaption>App · 320 × 640</figcaption><iframe src="http://localhost:4321/app" width="320" height="640"></iframe></figure>
</body></html>
