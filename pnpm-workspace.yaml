packages:
  - "apps/*"
  # The Android app has its own npm install. Expo builds more simply outside the pnpm workspace.
  - "!apps/mobile"
  - "packages/*"

# esbuild backs vitest; bigint-buffer speeds up web3.js account decoding.
# The websocket extras are optional native builds we do not need.
allowBuilds:
  bigint-buffer: true
  bufferutil: false
  esbuild: true
  utf-8-validate: false
